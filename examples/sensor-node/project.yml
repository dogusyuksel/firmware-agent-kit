# Ceedling 1.0 project for the sensor-node example (derived from templates/ceedling/project.yml).
:project:
  :build_root: build/test
  :test_file_prefix: test_
  :use_mocks: TRUE
  :default_tasks:
    - test:all

:paths:
  :test:
    - +:test/**
  :source:
    - src/**
  :include:
    - src/**

:defines:
  :test:
    - UNIT_TEST

:cmock:
  :mock_prefix: mock_
  :when_no_prototypes: :warn
  :enforce_strict_ordering: TRUE
  :plugins:
    - :ignore
    - :ignore_arg
    - :expect_any_args

:flags:
  :test:
    :compile:
      :*:
        - -std=c11
        - -Wall
        - -Wextra
# No :plugins: section on purpose: report plugin names differ between Ceedling 0.31
# (stdout_pretty_tests_report) and 1.0 (report_tests_pretty_stdout); the default output works on both.
