name: test

# Manual only (Actions tab -> "test" -> Run workflow) to save CI minutes. Pick what to run.
on:
  workflow_dispatch:
    inputs:
      unit:
        description: "Unit tests (Linux, Python 3.12) and Python 3.8 minimum-version check"
        type: boolean
        default: true
      example:
        description: "Example project: analysis (kit lint + cppcheck)"
        type: boolean
        default: true
      calibration:
        description: "False-positive calibration on official RTOS examples (clones the example repositories)"
        type: boolean
        default: false

jobs:
  unit:
    if: inputs.unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ARM toolchain and poppler
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi poppler-utils
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate JSON manifests
        run: python -c "import json;[json.load(open(p)) for p in ('.claude-plugin/plugin.json','.claude-plugin/marketplace.json','hooks/hooks.json','templates/firmware.json')]"

  min-python:
    # setup-python no longer ships 3.8 on current runners; uv provides a standalone 3.8 build.
    if: inputs.unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Unit tests on Python 3.8
        run: uv run --no-project --python 3.8 python -m unittest discover -s tests

  example:
    if: inputs.example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Analysis of the example (must stay finding-free)
        working-directory: examples/sensor-node
        run: python ../../tools/fw_analyze.py --all --tools lint,cppcheck

  calibration:
    if: inputs.calibration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No error-level findings on official FreeRTOS / STM32Cube examples
        run: python tests/calibrate_corpus.py --dir "${{ runner.temp }}/corpus"
